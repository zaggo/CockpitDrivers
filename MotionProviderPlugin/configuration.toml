# MotionProviderPlugin configuration (auto-generated with default values).
# Edit values and click "Reload config" in the status window to apply.
#
# State after the 2026-08-30 tuning campaign, signed off in the acceptance flight
# of that day (abnahme-motion-20260830-185827.csv). Nothing here is a candidate.
#
# Every value marked "adopted" has a rig verdict behind it, recorded with its
# measurements in docs/motion-tuning/tuning-log.md -- read that before changing
# one. Several obvious-looking moves have already been tried and rejected, and
# two of the effects were found to demand 14x more acceleration than the
# hardware can produce, which is not visible from the values alone.

[geometry]
base_radius_mm = 425
platform_radius_mm = 480
horn_length_mm = 100
rod_length_mm = 466
base_angle_deg = [60, 0, 300, 240, 180, 120]
anchor_angle_deg = [83.75, 336.25, 323.75, 216.25, 203.75, 96.25]
horn_azimuth_deg = [150, 270, 30, 150, 270, 30]
bff_actuator = [5, 6, 1, 2, 3, 4]

[servo]
angle_at_full_scale_deg = 45
demand_home = 32640
demand_max = 65280

[washout]
heave_gain = 0.15 # 30% of default 0.5
heave_hp_tau = 1
heave_vel_washout_tau = 0.25 # adopted 2026-08-30 after rig session; was 2 (see docs/motion-tuning/tuning-log.md)
heave_pos_washout_tau = 0.25 # adopted 2026-08-30 after rig session; was 2
heave_limit_mm = 30
tilt_surge_gain = 0.4 # adopted 2026-08-30; was 0.3
tilt_sway_gain = 0.4 # adopted 2026-08-30; was 0.3
tilt_lp_tau = 1.5
tilt_limit_deg = 7 # adopted 2026-08-30 after rig session; was 3
tilt_rate_limit_dps = 3 # adopted 2026-08-30 with limit 7: keeps the tilt below the ~3 deg/s
                        # rotation-detection threshold. Was 3 before, raised to 5 believing it
                        # masked jitter; the jitter was the saturated heave, not the tilt rate.
rot_roll_gain = 0.42 # 60% of default 0.7
rot_pitch_gain = 0.42 # 60% of default 0.7
rot_yaw_gain = 0.42 # 60% of default 0.7
rot_hp_tau = 1
rot_washout_tau = 3
rot_limit_deg = 7 # adopted 2026-08-30; was 3. Removes clipping in manoeuvring at no measurable cost; inert in normal flight
smooth_tau = 0.01 # ~20ms group delay (2*tau), shaves >~10Hz dataref grain, maneuver cues untouched. Next step 0.02; 0.08 was the old laggy tuning.

# Translational onset cue (2026-08-31). Complement of the tilt low-pass:
# tilt renders the sustained part, this renders the onset, crossover at
# tilt_lp_tau. OFF until a rig verdict adopts values -- see
# docs/superpowers/specs/2026-08-31-surge-sway-onset-cues-design.md.
#
# Measured 2026-09-01, first rig session (surge-sway-motion-20260901-215605):
# this channel is far stronger than the gain ratio against tilt suggests. The
# leaky double integration at trans_*_washout_tau = 0.25 delivers roughly
# 62 mm per m/s^2 of high-passed acceleration, so at gain 0.1 sway already sits
# at its 41 mm limit, and 0.5 clipped 6 % of ticks and pushed sat_envelope from
# its 4.32 % cue-off baseline to 7.15 % -- surge/sway stealing from heave and
# tilt, which is the one failure mode the design named.
#
# Stage 9 swept all eight reference segments (2026-09-02). Gain 0.1 is the
# largest that holds the envelope gate on every one of them; 0.15 misses it
# only on the most demanding recording, by 0.08 pp. The acceleration limiter
# does not engage any harder at any gain up to 0.2 -- sat_sl_acc stays within
# 1 pp of its cue-off value everywhere, so the 363 mm/s^2 heave budget does
# not transfer to the horizontal axes; the envelope is the binding constraint,
# not the limiter.
#
# trans_*_washout_tau is a SECOND AMPLITUDE knob, not a sharpness knob:
# shortening it shrinks displacement and peak acceleration together (approach
# segment, 0.25 -> 0.15: 20.5 -> 9.1 mm and 511 -> 352 mm/s^2). To make the cue
# bigger, lengthen it -- 0.4 roughly doubles the takeoff-push amplitude
# (7.4 -> 16.4 mm) and still holds the envelope gate on all eight segments,
# at the cost of the per-axis clamp biting 0.65 % of ticks on the worst one.
# See docs/motion-tuning/tuning-log.md, "Surge/sway onset channel".
#
# CANDIDATE, flown once, NOT yet accepted (2026-09-03). The rig session with
# 0.1/0.1 at tau 0.4 answered the design's open question: the handover reads as
# ONE cue, not two, and the pilot reported the tilt cues as noticeably stronger
# although live_pitch/live_roll are objectively smaller than the previous flight
# and bit-identical with the channel off -- the onset gives the sustained lean an
# interpretation. sway_gain comes down from 0.1 because ground handling makes
# 2-4x the lateral specific force of flight and clipped the 41 mm limit on the
# landing rollout; 0.07 peaks at 31 mm there and still leaves 10 mm p99 airborne.
# surge stays at 0.1 but also runs near its limit on the ground (42 of 43 mm) --
# if that ever needs fixing it wants a ground factor, not a lower gain.
surge_gain = 0.1
sway_gain = 0.07
trans_vel_washout_tau = 0.4
trans_pos_washout_tau = 0.4
surge_limit_mm = 43    # Task 1 measurement, see docs/motion-tuning/baseline-metrics.md
sway_limit_mm = 41     # Task 1 measurement

[effects]
touchdown_gain = 3.5      # adopted 2026-08-30. Was 3.6/6 Hz/0.25, which was 14x over
touchdown_freq_hz = 0.8   # the acceleration limit and dumped its whole contribution in the
touchdown_decay_tau = 0.55 # first 0.25 s -- the impact instant. Now peaks 1.5 s later.
rumble_gain = 0 # adopted 2026-08-30; was 0.9. 12 Hz is 14x over the acceleration
             # limit, so this only ever produced limiter clipping, felt as ground
             # roughness. See docs/motion-tuning/tuning-log.md.
rumble_freq_hz = 12
rumble_speed_ref_mps = 40
# Runway slab joints: one alternating step per slab, triggered by distance
# travelled, replacing the rumble above. 0 disables it. The step shrinks itself
# rather than overrunning the acceleration budget once the joints arrive faster
# than a full-size step can be rendered.
slab_spacing_m = 10      # adopted 2026-08-30
slab_step_mm = 2         # adopted. 1 mm was barely noticeable at the rig, 3 mm too
                         # much and irregular. Above ~30 m/s the budget caps the
                         # step near 1.1 mm whatever this says.
slab_accel_mm_s2 = 200   # not the full ~363 mm/s2 ceiling: the washout spends
                         # part of the same budget concurrently. 300 measured
                         # 39% limiter engagement on a ground roll, 200 gave 15%
                         # against 14% with no effect at all.
slab_min_speed_mps = 0.5
engine_gain = 0
buffet_gain = 0

[serial]
baud = 115200
output_rate_hz = 60

[safety]
max_velocity_cps = 30000 # keep < ~32000: actor-side speed cap is 0.5*stroke/s ~= 32640 counts/s
max_acceleration_cps2 = 120000 # back to default. Jerk-shaping lever if reversals get harsh again: lower stepwise (80000/60000; 42000 tracked fine, 12600 lagged).
park_heave_mm = -500
arm_ramp_sec = 6 # doubled from default 3: half-speed park<->live movement
disarm_ramp_sec = 4 # doubled from default 2
runaway_tilt_deg = 45
runaway_trans_mm = 500
runaway_hold_sec = 1
max_dt_sec = 0.1

[telemetry]
# Recording is a diagnostic aid and stays off at load, so an unattended flight
# cannot silently fill a disk -- start it from the status window when you want a
# recording. This section was missing from the file entirely; it is written out
# explicitly now so the knob is visible rather than only implied by the default.
enabled = false
dir = ""
