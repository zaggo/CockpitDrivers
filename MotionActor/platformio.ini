; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[avr]
platform = atmelavr
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
lib_extra_dirs =
  ../shared

[env:nanoatmega328new]
extends = avr
board = nanoatmega328new

; Smoothness test bench: CAN-triggered command-strategy experiments against the
; Kangaroo, sampled into RAM and dumped over CAN (see src/TestBench.h).
[env:nanoatmega328new_testbench]
extends = avr
board = nanoatmega328new
build_flags = -D MOTION_TESTBENCH=1

[env:megaatmega1280]
extends = avr
board = megaatmega1280
