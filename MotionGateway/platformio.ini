; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[avr]
platform = atmelavr
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
lib_extra_dirs =
  ../shared
; 64-byte default = 4 BFF frames = ~67 ms headroom at 60 Hz; a single long stall
; silently corrupts frames. The Mega has 8 KB RAM - buy headroom.
build_flags = -D SERIAL_RX_BUFFER_SIZE=256

[env:megaatmega2560]
extends = avr
board = megaatmega2560

; Bench console build (no PC link): interactive CAN test commands on USB serial.
[env:megaatmega2560_bench]
extends = avr
board = megaatmega2560
build_flags = ${avr.build_flags} -D BENCHDEBUG=1
